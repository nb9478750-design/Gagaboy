name: Build MojoLauncher APK

'on':
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build Android APK
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Extract project ZIP
    shell: bash
    run: |
      set -euo pipefail
      ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: No project ZIP found in the repository root."
        exit 1
      fi
      mkdir extracted
      unzip -q "$ZIP_FILE" -d extracted
      SETTINGS_FILE="$(find extracted -type f -name settings.gradle -o -name settings.gradle.kts -print -quit)"
      if [ -z "$SETTINGS_FILE" ]; then
        echo "ERROR: No Gradle settings file found inside the ZIP."
        exit 1
      fi
      PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
      cp -a "$PROJECT_DIR/." .
      test -f settings.gradle || test -f settings.gradle.kts

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build debug APK
    run: gradle assembleDebug --stacktrace

  - name: Upload APK
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: MojoLauncher-debug
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: warn
      retention-days: 7
